
plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.15.+'
	id 'maven-publish'
	id "me.modmuss50.mod-publish-plugin" version "2.2.0"

}

base {
	archivesName = project.archives_base_name
}
version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group


loom {
	accessWidenerPath = file("src/main/resources/goml.accesswidener")
}

// Keep server integration tests in a separate development mod, outside the released jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "goml-test"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

repositories {
	maven { url = "https://maven.fabricmc.net/" }
	maven { url = "https://maven.nucleoid.xyz/" }
	maven { url = 'https://jitpack.io' }
	maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
	maven { url 'https://maven.blamejared.com' }
	maven { url "https://maven.shedaniel.me" }
	maven { url "https://api.modrinth.com/maven" }
	maven { url 'https://repo.bluecolored.de/releases' }

	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}

	maven {
		url = "https://maven.jamieswhiteshirt.com/libs-release/"
		content {
			includeGroup 'com.jamieswhiteshirt'
		}
	}

	maven { url 'https://maven.ladysnake.org/releases' }

	maven {
		url "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}

	maven { url = "https://maven.resourcefulbees.com/repository/maven-public/" }

	maven { url 'https://repo.mikeprimm.com/' }

	//mavenLocal()
}

dependencies {
	//to change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation include("com.jamieswhiteshirt:rtree-3i-lite-fabric:${project.rtree_version}")
	// CCA for data
	modImplementation include("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}")

	modImplementation include("org.ladysnake.cardinal-components-api:cardinal-components-world:${project.cca_version}")

	// Flight
	modImplementation include("io.github.ladysnake:PlayerAbilityLib:${pal_version}")

	// Dev testing
	//modCompileOnly 'curse.maven:BLAST-349938:3838824'
	//modCompileOnly 'com.github.Ladysnake:BLAST:1.19-SNAPSHOT'
	//modCompileOnly 'vazkii.botania:Botania:1.18.1-427-FABRIC'


	//modCompileOnly "maven.modrinth:argonauts:${project.argonauts_version}"
	//modCompileOnly "maven.modrinth:resourceful-lib:${project.reslib_version}"
	compileOnly "curse.maven:dynmapforge-59433:5442994"

	// Server side stuff
	modImplementation "eu.pb4:polymer-core:${project.polymer_version}"
	modImplementation include("eu.pb4:sgui:${project.sgui_version}")
	modImplementation include("eu.pb4:placeholder-api:${project.placeholder_version}")
	modImplementation include("xyz.nucleoid:server-translations-api:${project.stapi_version}")
	modCompileOnly "me.lucko:fabric-permissions-api:0.3.1"
	modImplementation include("eu.pb4:common-protection-api:1.0.0")

	// Webmap integrations
	compileOnly "us.dynmap:DynmapCoreAPI:${dynmap_version}"
	compileOnly "de.bluecolored:bluemap-api:${bluemap_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version

	filesMatching('fabric.mod.json') {
		expand "version": project.version, "minecraft_version": project.minecraft_version
	}
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
	options.release = 21
	options.compilerArgs += ["-Xmaxerrs", "1000"]
}

jar {
	from "LICENSE"

	from("src/main/resources/data/goml/lang") {
		into("assets/goml/lang")
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			// add all the jars that should be included when publishing to maven

		}
	}

	// select the repositories you want to publish to
	repositories {
		// uncomment to publish to the local maven
		// mavenLocal()
	}
}


publishMods {
	changelog = System.getenv("CHANGELOG")
	type = project.mod_version.contains("-") ? BETA : STABLE
	file = remapJar.archiveFile
	modLoaders.add("fabric")

	if (System.getenv("CURSEFORGE")) {
		curseforge {
			projectId = "572651"
			accessToken = System.getenv("CURSEFORGE")
			client = true
			server = true

			minecraftVersions.add((project.minecraft_version.contains("-") ? ((String) project.minecraft_version.split("-")[0] + "-snapshot") : project.minecraft_version))
			for (String a : project.mc_extra_supported.split(",")) {
				if (!a.strip().isEmpty()) {
					minecraftVersions.add(a.strip())
				}
			}

			requires("polymer")
		}
	}

	if (System.getenv("MODRINTH")) {
		modrinth {
			accessToken = System.getenv("MODRINTH")
			projectId = 'j5niDupl'

			minecraftVersions.add(project.minecraft_version);
			for (String a : project.mc_extra_supported.split(",")) {
				if (!a.strip().isEmpty()) {
					minecraftVersions.add(a.strip())
				}
			}

			requires("polymer")
		}
	}
}

